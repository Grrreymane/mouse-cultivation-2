<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>鼠鼠修仙 v3</title>
  <meta name="description" content="一只鼠鼠的像素修仙之路 · 挂机放置小游戏">
  <meta property="og:title" content="鼠鼠修仙">
  <meta property="og:description" content="一只鼠鼠的像素修仙之路 · 挂机放置小游戏">
  <meta property="og:image" content="https://grrreymane.github.io/mouse-cultivation-2/cover.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flash-layer" id="flashLayer"></div>

<header class="topbar">
  <div class="brand">
    <canvas id="brandIcon" width="22" height="26"></canvas>
    <span class="brand-name">鼠鼠修仙</span>
    <span class="brand-ver">v3.7</span>
  </div>
  <div class="resources">
    <div class="res gold" title="灵石"><i class="coin"></i><b id="resGold">0</b></div>
    <div class="res token" title="天机令">🎫<b id="resToken">0</b></div>
    <div class="res mat" title="灵药">🌿<b id="resHerb">0</b></div>
    <div class="res mat" title="矿石">⛏️<b id="resOre">0</b></div>
    <div class="res mat" title="精华">💎<b id="resEssence">0</b></div>
  </div>
  <div class="top-actions">
    <div class="speed" id="speedGroup">
      <button data-action="speed" data-v="1" class="active">1×</button>
      <button data-action="speed" data-v="2">2×</button>
      <button data-action="speed" data-v="4">4×</button>
    </div>
    <button class="icon-btn" id="soundBtn" data-action="sound" title="音效">🔊</button>
    <button class="icon-btn" data-action="menu" title="菜单">☰</button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="battle" id="battleArea">
      <div class="battle-view" id="battleView"><canvas id="battleCanvas"></canvas></div>

      <div class="hud-player" id="hudPlayer">
        <div class="hud-row">
          <span class="realm-chip" id="hudRealm">炼气期</span>
          <span class="hud-level" id="hudLevel">Lv.1</span>
          <span class="hud-power" title="战力">战力 <b id="hudPower">0</b></span>
        </div>
        <div class="bar exp" title="修为"><i id="hudExpFill"></i><span id="hudExpText">0%</span></div>
        <div class="bar hp" title="生命"><i id="hudHpFill"></i><span id="hudHpText">100/100</span></div>
        <div class="hud-buffs" id="hudBuffs"></div>
      </div>

      <div class="hud-quest" id="questCard"></div>
      <div class="hud-streak" id="hudStreak"></div>
      <div class="hud-scene" id="hudScene"></div>

      <div class="trib-cta" id="tribCta">
        <div class="trib-main">
          <div class="trib-text">
            <div class="trib-title">⛈️ 天劫将至</div>
            <div class="trib-sub">渡劫突破 <b id="tribNext"></b></div>
          </div>
          <button class="btn btn-trib" data-action="tribulation" id="tribBtn">⚡ 渡劫 <small id="tribChance">60%</small></button>
        </div>
        <div class="trib-tip" id="tribTip">服用金元丹、装备更好的法宝可提升成功率</div>
      </div>

      <div class="death-overlay" id="deathOverlay">
        <div class="death-title">鼠鼠陨落了…</div>
        <div class="death-sub"><b id="reviveCountdown">5</b> 秒后重生</div>
        <div class="death-tip" id="deathTip"></div>
      </div>

      <div class="skillbar" id="skillBar"></div>
      <div class="toasts" id="toasts"></div>
    </div>

    <div class="logbox" id="logbox">
      <div class="log-head">
        <span>📜 修行日志</span>
        <span class="log-dps">DPS <b id="dpsValue">0</b></span>
        <button class="link-btn" data-action="toggleLog" id="logToggle">收起</button>
      </div>
      <div class="log-list" id="battleLog"></div>
    </div>
  </section>

  <aside class="side">
    <nav class="tabs" id="tabs"></nav>
    <div class="tab-body" id="tabBody"></div>
  </aside>
</main>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="menu-mask" id="menuMask" data-action="closeMenu">
  <div class="menu" id="menu">
    <div class="menu-title">☰ 菜单</div>
    <button class="menu-item" data-action="changelog">📋 迭代记录</button>
    <button class="menu-item" data-action="help">❓ 玩法说明</button>
    <button class="menu-item" data-action="exportSave">💾 导出存档</button>
    <button class="menu-item" data-action="importSave">📥 导入存档</button>
    <button class="menu-item danger" data-action="reset">🗑️ 重置游戏</button>
  </div>
</div>

<script src="sprites.js"></script>
<script src="pixelart.js"></script>
<script src="sound.js"></script>
<script src="engine.js"></script>
<script src="renderer.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
