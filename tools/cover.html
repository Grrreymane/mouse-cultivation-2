<!doctype html>
<!-- 封面生成器：用游戏本体的像素素材合成 320x180 画面，4 倍放大为 1280x720。浏览器直接打开此文件，右键另存画布即可 -->
<html><head><meta charset="utf-8"><title>cover</title>
<style>body{margin:0;background:#111}canvas{display:block;image-rendering:pixelated}</style></head>
<body><canvas id="out"></canvas>
<script src="../public/sprites.js"></script>
<script src="../public/pixelart.js"></script>
<script>
// 封面：在 320x180 像素画布上合成，再 4 倍最近邻放大到 1280x720
const W = 320, H = 180, K = 4;
const lo = document.createElement('canvas'); lo.width = W; lo.height = H;
const g = lo.getContext('2d'); g.imageSmoothingEnabled = false;
const P = (x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- 天空：暮色金霞（色带分层，像素风） ----------
const bands = ['#2A0C2E', '#4A1238', '#7A1E40', '#A83A44', '#D2604A', '#EC8E58', '#F8B868', '#FCD88A'];
const skyH = 128;
bands.forEach((c, i) => {
  const y0 = Math.floor(i * skyH / bands.length), y1 = Math.floor((i + 1) * skyH / bands.length);
  P(0, y0, c, W, y1 - y0);
  // 色带交界处的抖动像素
  if (i > 0) for (let x = (i * 3) % 4; x < W; x += 4) P(x, y0 - 1, c);
});
// 星星（上方）
for (let i = 0; i < 70; i++) { const y = rnd() * 40; P(rnd() * W, y, rnd() > 0.7 ? '#FFFFFF' : 'rgba(255,230,240,0.6)'); }
// 夕阳
function disc(cx, cy, r, c) { for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); P(cx - w, cy + y, c, w * 2 + 1, 1); } }
disc(236, 78, 34, '#FDE6A8'); disc(236, 78, 29, '#FFF3CC');
for (let y = 60; y < 100; y += 5) P(236 - 40, y, 'rgba(236,142,88,0.55)', 80, 1); // 云纹横切

// ---------- 远山（水墨层次） ----------
function ridge(base, amp, freq, color, s, jag = 1) {
  for (let x = 0; x < W; x++) {
    const h = Math.sin(x * freq + s) * amp * 0.6 + Math.sin(x * freq * 2.3 + s * 2) * amp * 0.3 + Math.sin(x * freq * 5.1 + s) * amp * 0.1 * jag;
    const top = Math.floor(base - Math.abs(h));
    P(x, top, color, 1, H - top);
  }
}
ridge(118, 46, 0.018, '#B8584E', 1.3, 2);
ridge(128, 34, 0.026, '#8E3A44', 4.1, 2);
// 仙山孤峰 + 宝塔
function peak(cx, top, w, color, shade) {
  for (let y = top; y < H; y++) { const t = (y - top) / (H - top); const hw = Math.floor(w * (0.12 + t * 0.9)); P(cx - hw, y, color, hw * 2, 1); P(cx - hw, y, shade, Math.max(1, Math.floor(hw * 0.5)), 1); }
}
peak(150, 52, 30, '#6A2A3E', '#56203A');
// 宝塔（七层）
for (let i = 0; i < 6; i++) { const w = 12 - i * 1.6, y = 52 - i * 5; P(150 - w / 2 - 2, y, '#2A0E22', w + 4, 1); P(150 - w / 2, y + 1, '#3A1830', w, 4); P(150 - 1, y + 2, '#FFD27A', 2, 1); }
P(149, 20, '#2A0E22', 2, 3); P(149.5, 18, '#FFD27A', 1, 2);
ridge(146, 22, 0.034, '#5A2238', 7.7, 3);

// 云海
function cloud(x, y, w, c, sh) {
  for (let i = 0; i < w; i += 6) disc(x + i, y - (i % 12 ? 1 : 3), 5 + (i % 9 === 0 ? 2 : 0), c);
  P(x - 5, y + 2, sh, w + 10, 2);
}
cloud(10, 136, 90, '#E8A6A0', '#C07A7E');
cloud(120, 140, 70, '#F0B8A8', '#C8847E');
cloud(210, 132, 60, '#E8A6A0', '#C07A7E');
cloud(30, 88, 40, 'rgba(252,216,190,0.8)', 'rgba(210,140,130,0.6)');
cloud(270, 44, 34, 'rgba(252,216,190,0.8)', 'rgba(210,140,130,0.6)');

// ---------- 前景：左侧悬崖（鼠鼠）+ 右侧岩台（真龙） ----------
function cliff(x0, x1, top, c, dark, lip) {
  for (let x = x0; x < x1; x++) {
    const t = (x - x0) / (x1 - x0);
    const y = Math.floor(top + Math.sin(t * 9 + x0) * 1.5 + (t > 0.85 ? (t - 0.85) * 60 : 0));
    P(x, y, lip, 1, 2); P(x, y + 2, c, 1, H - y);
    if ((x * 7) % 11 === 0) P(x, y + 4 + (x % 5), dark, 1, 6 + (x % 7));
  }
}
cliff(-4, 190, 152, '#4A2A30', '#2E1820', '#7A4E3E');
cliff(184, 330, 162, '#3E2230', '#281420', '#6A3E3E');
// 苍松（左上崖边）
function pine(x, y, s) {
  P(x, y - 26 * s, '#3A2418', 2, 26 * s);
  [[0, 10], [-6, 14], [-10, 18], [4, 20]].forEach(([dx, dy], i) => { for (let k = 0; k < 4; k++) P(x + dx - 6 + k, y - 30 * s + dy + k, '#1E3A2A', 14 - k * 2, 2); P(x + dx - 5, y - 30 * s + dy, '#2E5A3A', 10, 1); });
}
pine(18, 152, 1);
// 飘落的花瓣
for (let i = 0; i < 40; i++) { const x = rnd() * W, y = rnd() * 150; P(x, y, rnd() > 0.5 ? '#FFB8C8' : '#FFD8E0', rnd() > 0.7 ? 2 : 1, 1); }

// ---------- 角色 ----------
// 劫雷真龙（2 倍，面朝左）
PixelArt.draw(g, '劫雷真龙', 256, 166, { frame: 0, scale: 2 });
// 雷光
function bolt(x0, y0, x1, y1, c, w) {
  let x = x0, y = y0; const n = Math.ceil(Math.abs(y1 - y0) / 6);
  for (let i = 1; i <= n; i++) { const nx = x0 + (x1 - x0) * i / n + (i < n ? (rnd() - 0.5) * 10 : 0), ny = y0 + (y1 - y0) * i / n; const steps = Math.ceil(Math.hypot(nx - x, ny - y)); for (let k = 0; k <= steps; k++) P(x + (nx - x) * k / steps, y + (ny - y) * k / steps, c, w, w); x = nx; y = ny; }
}
bolt(300, 0, 286, 40, '#BFF4FF', 2); bolt(300, 0, 286, 40, '#FFFFFF', 1);
bolt(188, 6, 196, 34, '#BFF4FF', 1);
// 灵兽青鳞蛟龙（跟在鼠鼠身后，1 倍）
PixelArt.draw(g, 'jade_dragon', 34, 92, { frame: 1 });
// 鼠鼠·大乘期（2 倍，面朝右，举剑）
const hero = document.createElement('canvas'); hero.width = 80; hero.height = 80;
const hg = hero.getContext('2d'); hg.imageSmoothingEnabled = false;
Sprites.drawMouseByRealm(hg, 30, 56, 1, 5, 40, 3, {});
// 去掉半透明光晕（游戏里用抗锯齿椭圆画的），只留实心像素
{ const d = hg.getImageData(0, 0, 80, 80); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 200 ? 255 : 0; hg.putImageData(d, 0, 0); }
g.drawImage(hero, 96 - 34 * 3, 153 - 56 * 3, 240, 240);
// 剑气


// 暗角
for (let y = 0; y < H; y++) for (let x = 0; x < W; x += 1) {
  const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2), d = dx * dx * 0.6 + dy * dy * 0.5;
  if (d > 0.55 && ((x + y) % 2 === 0 || d > 0.8)) P(x, y, `rgba(20,4,16,${Math.min(0.5, (d - 0.55) * 0.9)})`);
}

// ---------- 标题：像素化中文 ----------
function pixelText(text, size, font) {
  const c = document.createElement('canvas'); c.width = size * text.length + 20; c.height = size + 12;
  const x = c.getContext('2d'); x.font = `900 ${size}px ${font}`; x.textBaseline = 'top'; x.fillStyle = '#fff'; x.fillText(text, 4, 4);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  const mask = []; let maxX = 0;
  for (let yy = 0; yy < c.height; yy++) for (let xx = 0; xx < c.width; xx++) { const on = d[(yy * c.width + xx) * 4 + 3] > 110; mask.push(on); if (on) maxX = Math.max(maxX, xx); }
  return { w: c.width, h: c.height, mask, width: maxX + 1 };
}
function stampText(t, ox, oy, fills, outline, shadow) {
  const on = (x, y) => x >= 0 && y >= 0 && x < t.w && y < t.h && t.mask[y * t.w + x];
  for (let y = -3; y < t.h + 3; y++) for (let x = -3; x < t.w + 3; x++) {
    if (on(x, y)) continue;
    let near = false, far = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (on(x + dx, y + dy)) near = true;
    if (near) P(ox + x, oy + y, outline);
    else if (shadow && on(x - 2, y - 2)) far = true;
    if (far) P(ox + x, oy + y, shadow);
  }
  for (let y = 0; y < t.h; y++) for (let x = 0; x < t.w; x++) if (on(x, y)) {
    const f = fills[Math.min(fills.length - 1, Math.floor(y / t.h * fills.length * 1.15))];
    P(ox + x, oy + y, f);
  }
}
const FONT = '"STKaiti","KaiTi","楷体","Noto Serif SC","SimSun",serif';
const title = pixelText('鼠鼠修仙', 34, FONT);
const tx = Math.floor((W - title.width) / 2);
stampText(title, tx, 6, ['#FFF6D0', '#FFE08A', '#FFC84A', '#F09A2E', '#D86A1E'], '#3A0E10', '#1A0408');

// ---------- 放大输出 ----------
const out = document.getElementById('out'); out.width = W * K; out.height = H * K;
const o = out.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(lo, 0, 0, W * K, H * K);
// 副标题：用半像素网格（输出上 2×2）绘制，保证中文清晰
{
  const t = pixelText('一只鼠鼠的像素修仙之路', 26, '"Microsoft YaHei","PingFang SC",sans-serif');
  const S2 = K / 2, ox = Math.floor((W * K - t.width * S2) / 2), oy = 49 * K;
  const on = (x, y) => x >= 0 && y >= 0 && x < t.w && y < t.h && t.mask[y * t.w + x];
  for (let y = -2; y < t.h + 2; y++) for (let x = -2; x < t.w + 2; x++) {
    let c = null;
    if (on(x, y)) c = '#FFF0DC';
    else { for (let dy = -2; dy <= 2 && !c; dy++) for (let dx = -2; dx <= 2; dx++) if (Math.abs(dx) + Math.abs(dy) <= 3 && on(x + dx, y + dy)) { c = '#3A0E10'; break; } }
    if (c) { o.fillStyle = c; o.fillRect(ox + x * S2, oy + y * S2, S2, S2); }
  }
}
window.saveShot = async name => { await fetch('/__save?name=' + name, { method: 'POST', body: out.toDataURL() }); return 'saved'; };
</script>
</body></html>
